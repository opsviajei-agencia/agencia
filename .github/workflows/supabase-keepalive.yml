name: Supabase keep-alive

# Evita que o Supabase (plano gratis) pause o projeto por inatividade.
# Faz uma consulta leve no banco a cada 3 dias.
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve no banco
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://bdzrmdfoyazhihiminnl.supabase.co/rest/v1/emissoes?select=id&limit=1" \
            -H "apikey: sb_publishable_TMtZdr_wWuv75P79-m2ANA_DeR6jO_Q")
          echo "HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "::error::Supabase nao respondeu (HTTP $code). Pode estar pausado: supabase.com/dashboard > Resume project"
            exit 1
          fi

      # GitHub desliga agendamentos em repos sem commits por 60 dias.
      # Um commit minimo no dia 1 de cada mes mantem a automacao viva.
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'schedule' }}
      - name: Manter agendamento ativo
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u > .github/keepalive.txt
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "keepalive" && git push
          fi
